# /FIintrin.h: cairo defines __attribute__(x) away for any compiler that is not __GNUC__ and then includes
# <wchar.h>, which pulls in clang's intrinsic headers; those are written with __attribute__ and stop compiling.
# Included first, they leave the macro nothing to break.
[built-in options]
b_vscrt = 'md'
c_args = ['/FIintrin.h', '/DNDEBUG', '/O2', '/Ob2']
cpp_args = ['/DNDEBUG', '/EHsc', '/O2', '/Ob2']
